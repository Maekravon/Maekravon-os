<script>
/* PROOF private cloud snapshot adapter. No credentials are embedded in this build.
   Uses Supabase Auth, RLS and explicit manual uploads/downloads after configuration.
   A separate project is REQUIRED; this adapter must never point at MAEKRAVON. */
(() => {
  'use strict';
  const cfg = window.PROOF_CONFIG || {};
  const configured = /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cfg.url || '') &&
    /^sb_publishable_[a-zA-Z0-9_\-]+$/.test(cfg.publishableKey || '');
  let client = null, session = null, workspace = null, loading = false, error = '';
  const notify = () => document.dispatchEvent(new Event('proof-cloud-status'));
  const errorText = e => String(e?.message || e || 'Unable to reach the cloud service').slice(0, 260);
  async function ensureClient() {
    if (!configured) throw Error('PROOF cloud is not configured.');
    if (client) return client;
    // Production deployments should bundle an audited/pinned SDK; this bridge uses
    // a pinned ESM distribution for the static demo-compatible source package.
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.49.1?bundle');
    client = createClient(cfg.url.replace(/\/$/, ''), cfg.publishableKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    client.auth.onAuthStateChange((_event, current) => {
      session = current;
      if (!current) workspace = null;
      notify();
    });
    const result = await client.auth.getSession();
    if (result.error) throw result.error;
    session = result.data?.session || null;
    if (session) await ensureWorkspace();
    notify();
    return client;
  }
  async function ensureWorkspace() {
    if (!session?.user) throw Error('Sign in first.');
    if (workspace) return workspace;
    const api = await ensureClient();
    const { data: rows, error: selectError } = await api.from('proof3_workspaces')
      .select('id,name').eq('owner_id', session.user.id).order('created_at',{ascending:true}).limit(1);
    if (selectError) throw selectError;
    if (rows?.[0]) workspace = rows[0];
    else {
      const { data, error: insertError } = await api.from('proof3_workspaces')
        .insert({ owner_id: session.user.id, name: 'My PROOF Workspace' })
        .select('id,name').single();
      if (insertError) throw insertError;
      workspace = data;
    }
    notify();
    return workspace;
  }
  async function signUp(email,password) {
    const api = await ensureClient();
    if (!email || (password || '').length < 8) throw Error('Enter a valid email and a password of at least 8 characters.');
    const { data, error: e } = await api.auth.signUp({email:email.trim(),password});
    if (e) throw e;
    session = data.session;
    if (session) await ensureWorkspace();
    notify();
    return { pending: !session };
  }
  async function signIn(email,password) {
    const api = await ensureClient();
    const { data, error: e } = await api.auth.signInWithPassword({email:email.trim(),password});
    if (e) throw e;
    session = data.session;
    workspace = null;
    await ensureWorkspace();
    notify();
    return {pending:false};
  }
  async function signOut() {
    if (!client) return;
    const {error:e} = await client.auth.signOut();
    if(e)throw e;
    session = null;workspace = null;notify();
  }
  async function push(payload) {
    const api = await ensureClient();
    if (!session?.user) throw Error('Sign in first.');
    const ws = await ensureWorkspace();
    const serial = JSON.stringify(payload);
    if (serial.length > 2_500_000) throw Error('This workspace exceeds the 2.5 MB cloud demo limit. Export JSON and reduce size.');
    const {error:e} = await api.from('proof3_workspace_snapshots')
      .upsert({workspace_id:ws.id,owner_id:session.user.id,payload,updated_at:new Date().toISOString()}, {onConflict:'workspace_id'});
    if (e) throw e;
  }
  async function pull() {
    const api = await ensureClient();
    if (!session?.user) throw Error('Sign in first.');
    const ws = await ensureWorkspace();
    const {data,error:e}=await api.from('proof3_workspace_snapshots')
      .select('payload').eq('workspace_id',ws.id).single();
    if (e) throw e;
    return data?.payload;
  }
  async function init(){
    if(!configured)return;
    loading=true;
    try {await ensureClient();}
    catch(e){error=errorText(e);}
    finally{loading=false;notify();}
  }
  window.ProofCloud={init,signUp,signIn,signOut,push,pull,
    getState:()=>({configured,connected:!!session?.user,email:session?.user?.email||'',workspace:workspace?.name||'',loading,error})};
  if(configured)init();
})();

</script>

function stagePoint(event,canvas){const r=canvas.getBoundingClientRect();return {x:Math.min(1,Math.max(0,(event.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(event.clientY-r.top)/r.height))};}
function shapeDraw(ctx,s,w=CANVAS_W,h=CANVAS_H){
 const from=s.from||s.pos||{x:.5,y:.5};const to=s.to||from;const x=from.x*w,y=from.y*h,ex=to.x*w,ey=to.y*h;
 ctx.lineWidth=(s.kind==='pen'?4:5);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.color||'#c8ff52';ctx.fillStyle=s.color||'#c8ff52';ctx.shadowColor='#0007';ctx.shadowBlur=5;
 if(s.kind==='player'||s.kind==='defender'){
  ctx.beginPath();ctx.arc(x,y,14,0,2*Math.PI);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0b131b';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.label|| (s.kind==='player'?'O':'X'),x,y+1);return;
 }
 if(s.kind==='text'){ctx.shadowBlur=0;ctx.fillStyle=s.color||'#c8ff52';ctx.textAlign='left';ctx.font='bold 22px Arial';ctx.fillText(s.label||'LABEL',x,y);return;}
 if(s.kind==='circle'){const radius=Math.max(12,Math.hypot(ex-x,ey-y));ctx.beginPath();ctx.arc(x,y,radius,0,2*Math.PI);ctx.stroke();return;}
 const points=s.kind==='pen'&&s.points?s.points:[from,to];if(points.length<2)return;
 ctx.beginPath();ctx.moveTo(points[0].x*w,points[0].y*h);for(const pt of points.slice(1))ctx.lineTo(pt.x*w,pt.y*h);ctx.stroke();
 if(s.kind==='arrow'){
  const angle=Math.atan2(ey-y,ex-x),len=17;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-len*Math.cos(angle-.55),ey-len*Math.sin(angle-.55));ctx.lineTo(ex-len*Math.cos(angle+.55),ey-len*Math.sin(angle+.55));ctx.closePath();ctx.fill();
 }
}
function paintField(ctx,sport){
 const w=CANVAS_W,h=CANVAS_H;const type=SPORT_BOARD[sport]||'grid';
 const green=type==='football'||type==='soccer';ctx.fillStyle=green?'#0d3429':type==='basketball'?'#33302a':type==='hockey'?'#203141':'#182a30';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle=green?'#739d79':'#728792';ctx.lineWidth=2;ctx.globalAlpha=.62;
 if(type==='football'){
  for(let i=0;i<=12;i++){let x=i*w/12;ctx.beginPath();ctx.moveTo(x,18);ctx.lineTo(x,h-18);ctx.stroke();if(i>0&&i<12){ctx.font='16px Arial';ctx.fillStyle='#c6dec9';ctx.fillText(String(Math.min(i,12-i)*10),x-14,h-33)}}
  for(let j=0;j<=2;j++){ctx.beginPath();ctx.moveTo(16,18+j*(h-36)/2);ctx.lineTo(w-16,18+j*(h-36)/2);ctx.stroke()}
 }else if(type==='basketball'){
  ctx.strokeRect(18,18,w-36,h-36);ctx.beginPath();ctx.moveTo(w/2,18);ctx.lineTo(w/2,h-18);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,75,0,2*Math.PI);ctx.stroke();
  for(const side of [0,1]){const x=side? w-18:18,dir=side?-1:1;ctx.strokeRect(side?w-215:18,170,197,200);ctx.beginPath();ctx.arc(x+dir*75,h/2,90,Math.PI/2,Math.PI*1.5,!!side);ctx.stroke();ctx.beginPath();ctx.arc(x+dir*77,h/2,15,0,2*Math.PI);ctx.stroke()}
 }else if(type==='soccer'){
  ctx.strokeRect(18,18,w-36,h-36);ctx.beginPath();ctx.moveTo(w/2,18);ctx.lineTo(w/2,h-18);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,70,0,2*Math.PI);ctx.stroke();ctx.strokeRect(18,142,138,256);ctx.strokeRect(w-156,142,138,256);ctx.strokeRect(18,209,52,122);ctx.strokeRect(w-70,209,52,122);
 }else if(type==='baseball'){
  const home={x:w*.5,y:h*.88};for(const pt of [{x:w*.22,y:h*.5},{x:w*.5,y:h*.15},{x:w*.78,y:h*.5}]){ctx.beginPath();ctx.moveTo(home.x,home.y);ctx.lineTo(pt.x,pt.y);ctx.stroke()}
  const diamond=[home,{x:w*.35,y:h*.53},{x:w*.5,y:h*.32},{x:w*.65,y:h*.53},home];ctx.beginPath();ctx.moveTo(diamond[0].x,diamond[0].y);for(const pt of diamond.slice(1))ctx.lineTo(pt.x,pt.y);ctx.stroke();
 }else if(type==='volleyball'){
  ctx.strokeRect(35,30,w-70,h-60);ctx.beginPath();ctx.moveTo(w/2,30);ctx.lineTo(w/2,h-30);ctx.moveTo(w*.30,30);ctx.lineTo(w*.30,h-30);ctx.moveTo(w*.70,30);ctx.lineTo(w*.70,h-30);ctx.stroke();
 }else if(type==='hockey'){
  ctx.strokeRect(30,40,w-60,h-80);for(const x of [w*.28,w*.5,w*.72]){ctx.beginPath();ctx.moveTo(x,40);ctx.lineTo(x,h-40);ctx.stroke()}for(const x of [w*.29,w*.71]){ctx.beginPath();ctx.arc(x,h/2,45,0,2*Math.PI);ctx.stroke()}
 }else{
  for(let x=0;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()};for(let y=0;y<h;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 ctx.fillStyle='#ffffff66';ctx.font='bold 13px Arial';ctx.textAlign='left';ctx.fillText('PROOF / SHARPE × MAE · '+sport.toUpperCase(),24,30);
}
function drawBoard(){const c=$('#play-canvas');if(!c)return;const ctx=c.getContext('2d');paintField(ctx,boardState.sport);for(const item of boardState.objects)shapeDraw(ctx,item);if(boardState.drag?.shape)shapeDraw(ctx,boardState.drag.shape);}
function drawFilm(){const c=$('#proof-film-overlay');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,CANVAS_W,CANVAS_H);const marks=db.filmMarks.filter(m=>m.gameId===filmState.gameId&&Math.abs(Number(m.at)-filmState.time)<1.6);for(const mark of marks)for(const sh of mark.shapes||[])shapeDraw(ctx,sh);for(const sh of filmState.draft)shapeDraw(ctx,sh);if(filmState.active)shapeDraw(ctx,filmState.active);}
function restoreMedia(){const video=$('#proof-film-video');if(video){video.playbackRate=filmState.rate;const apply=()=>{if(filmState.time&&Number.isFinite(video.duration))video.currentTime=Math.min(filmState.time,video.duration);drawFilm()};video.addEventListener('loadedmetadata',apply,{once:true});if(video.readyState>=1)apply();}drawBoard();drawFilm();}
function takeSnapshot(){boardState.history.push(JSON.stringify(boardState.objects));if(boardState.history.length>70)boardState.history.shift();boardState.future=[];}
function boardPointerDown(ev){const c=$('#play-canvas');if(!c||ev.target!==c)return;const pt=stagePoint(ev,c);c.setPointerCapture(ev.pointerId);
 if(boardState.tool==='erase'){const i=findBoardObject(pt);if(i>=0){takeSnapshot();boardState.objects.splice(i,1);drawBoard()}return;}
 if(boardState.tool==='move'){const i=findBoardObject(pt);if(i>=0){takeSnapshot();boardState.drag={mode:'move',index:i,last:pt};}return;}
 if(boardState.tool==='text'){const label=prompt('Write a field label (max 20 characters):','WR / MOTION');if(label){takeSnapshot();boardState.objects.push({kind:'text',pos:pt,color:boardState.color,label:label.slice(0,20)});drawBoard();}return;}
 if(boardState.tool==='player'||boardState.tool==='defender'){takeSnapshot();boardState.objects.push({kind:boardState.tool,pos:pt,color:boardState.tool==='defender'?'#ff4554':boardState.color,label:boardState.tool==='defender'?'X':'O'});drawBoard();return;}
 boardState.drag={mode:'draw',shape:{kind:boardState.tool,from:pt,to:pt,color:boardState.color,points:[pt]}};drawBoard();}
function findBoardObject(pt){for(let i=boardState.objects.length-1;i>=0;i--){const s=boardState.objects[i];const p=s.pos||s.from;if(p&&Math.hypot((pt.x-p.x)*CANVAS_W,(pt.y-p.y)*CANVAS_H)<27)return i;}return -1;}
function boardPointerMove(ev){if(!boardState.drag)return;const c=$('#play-canvas');if(!c)return;const pt=stagePoint(ev,c),drag=boardState.drag;
 if(drag.mode==='move'){const obj=boardState.objects[drag.index],dx=pt.x-drag.last.x,dy=pt.y-drag.last.y;for(const p of [obj.pos,obj.from,obj.to,...(obj.points||[])])if(p){p.x=Math.min(1,Math.max(0,p.x+dx));p.y=Math.min(1,Math.max(0,p.y+dy));}drag.last=pt;}
 else{drag.shape.to=pt;if(drag.shape.kind==='pen')drag.shape.points.push(pt);}drawBoard();}
function boardPointerUp(){if(!boardState.drag)return;const drag=boardState.drag;if(drag.mode==='draw'){takeSnapshot();boardState.objects.push(drag.shape)}boardState.drag=null;drawBoard();}
function filmPointerDown(ev){const c=$('#proof-film-overlay');if(!c||ev.target!==c)return;const video=$('#proof-film-video');if(video&&video.duration)video.pause();c.setPointerCapture(ev.pointerId);const pt=stagePoint(ev,c);filmState.active={kind:filmState.tool,from:pt,to:pt,color:filmState.color,points:[pt]};drawFilm();}
function filmPointerMove(ev){if(!filmState.active)return;const c=$('#proof-film-overlay');if(!c)return;const pt=stagePoint(ev,c);filmState.active.to=pt;if(filmState.active.kind==='pen')filmState.active.points.push(pt);drawFilm();}
function filmPointerUp(){if(!filmState.active)return;filmState.draft.push(filmState.active);filmState.active=null;drawFilm();}

function simpleHash(text){let h=2166136261;for(let i=0;i<text.length;i++)h=Math.imul(h^text.charCodeAt(i),16777619);return (h>>>0).toString(16);}
function universalCommit(){

 const selectedGame=game(ui.importGame);if(!selectedGame||selectedGame.sport!==ui.importSport){toast('Choose a game matching this sport.');return;}
 const source=$('#import-source')?.value||'Authorized CSV';const allowCustom=$('#import-custom')?.checked;
 const fingerprint=simpleHash(csvDraft.raw+'|'+selectedGame.id+'|'+source);
 if(db.importHistory.includes(fingerprint)){toast('This file was already imported for this game.');return;}
 const headers=csvDraft.headers,rows=csvDraft.rows,columns=headers.map(cleanHeader);
 const findColumn=(names)=>{for(const h of names){const i=columns.indexOf(h);if(i>=0)return i;}return -1;};
 const nameCol=csvDraft.mapping?.player?columns.indexOf(cleanHeader(csvDraft.mapping.player)):findColumn(['athlete_id','player_id','athlete_name','player_name','full_name','player','athlete','name','playerid','athleteid']);
 const statCol=csvDraft.mapping?.stat?columns.indexOf(cleanHeader(csvDraft.mapping.stat)):findColumn(['stat','metric','category']),valCol=csvDraft.mapping?.value?columns.indexOf(cleanHeader(csvDraft.mapping.value)):findColumn(['value','quantity','qty']);
 const periodCol=findColumn(['period','quarter']),clockCol=findColumn(['clock','time']),noteCol=findColumn(['note','notes']);
 const gameCol=findColumn(['game_id']),teamCol=csvDraft.mapping?.team?columns.indexOf(cleanHeader(csvDraft.mapping.team)):findColumn(['team','school','team_name','school_name']);
 if(nameCol<0){toast('Choose a Player column in the mapping panel.');return;}
 const mode=csvDraft.mapping?.mode&&csvDraft.mapping.mode!=='auto'?csvDraft.mapping.mode:(statCol>=0&&valCol>=0?'long':'wide'),add=[],addStats=[],issues=[],seen=new Set();
 const sport=ui.importSport;
 for(let i=0;i<rows.length;i++){
  const cells=rows[i],find=(col)=>col>=0?(cells[col]||'').trim():'';
  const gid=find(gameCol)||selectedGame.id,g=game(gid);const rawPlayer=find(nameCol);const team=find(teamCol).toLowerCase();

   if(metric.startsWith('custom_')&&!statOptions(sport).some(([k])=>k===metric)&&!addStats.some(x=>x[0]===metric))addStats.push([metric,field.slice(0,70),'Imported custom']);

.hudl))}</p>`:''}<footer>PROOF / ${new Date().toISOString().slice(0,10)} · Created from a local prototype. No school verification.</footer></body></html>`;download('proof-'+a.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-packet.html',doc,'text/html');toast('Recruiting packet downloaded.');}
function csvParser(text){const rows=[];let row=[],v='',quotes=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quotes&&text[i+1]==='"'){v+='"';i++;}else if(c==='"')quotes=!quotes;else if(c===','&&!quotes){row.push(v);v='';}else if((c==='\n'||c==='\r')&&!quotes){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);v='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}else v+=c;}if(quotes)throw Error('Unclosed CSV quote');if(v||row.length){row.push(v);rows.push(row);}return rows;}
function importCsv(content){const rows=csvParser(content);if(rows.length<2)throw Error('CSV needs headers and at least one row.');if(rows.length>2001)throw Error('Import up to 2,000 rows per file.');const headers=rows.shift().map(s=>s.trim().replace(/^\uFEFF/,''));const required=['game_id','athlete_id','stat','value','period','clock','note'];if(required.some(x=>!headers.includes(x)))throw Error('CSV needs columns: '+required.join(', '));const additions=[];const issues=[];rows.forEach((row,i)=>{const data=Object.fromEntries(headers.map((h,j)=>[h,(row[j]||'').trim()]));const g=game(data.game_id),a=athlete(data.athlete_id),v=Number(data.value);if(!g||!a||a.sport!==g.sport||(a.school!==g.home&&a.school!==g.away)||!statOptions(g.sport).some(x=>x[0]===data.stat)||!Number.isFinite(v)||v< -9999||v>9999){issues.push(i+2);return;}additions.push({id:uid('csv'),gameId:g.id,athleteId:a.id,stat:data.stat,value:v,period:data.period.slice(0,12)||'GAME',clock:data.clock.slice(0,12),note:data.note.slice(0,180),source:'csv-unverified',createdAt:new Date().toISOString()});});if(issues.length)throw Error('Invalid entry on CSV row(s): '+issues.slice(0,12).join(', ')+(issues.length>12?'...':'')+'. No rows were imported.');db.events.push(...additions);save();render();toast('Imported '+additions.length+' unverified stat entries.');}
function clickAction(a){const [cmd,...parts]=a.split(':');const val=parts.join(':');if(v3Action(cmd,val))return;if(playAction(cmd,val))return;if(cmd==='universalCommit'){universalCommit();return;}if(cmd==='universalTemplate'){const g=game(ui.importGame),a=db.athletes.find(a=>a.sport===ui.importSport&&(a.school===g?.home||a.school===g?.away)),keys=statOptions(ui.importSport).slice(0,2).map(s=>s[0]);const csv='player,team,'+keys.join(',')+',period,clock,note\n'+[a?.name||'Sample Athlete',a?.school||'Sample School',...keys.map(()=>1),'GAME','12:00','Example'].join(',')+'\n';download('proof-'+ui.importSport.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-template.csv',csv,'text/csv');return;}if(cmd==='nav'){navigate(val);return;}if(cmd==='back'){navigate(val);return;}if(cmd==='sport'){ui.sport=val;render();return;}if(cmd==='profileSeason'){ui.profileSeason=val;render();return;}if(cmd==='scoutSport'){ui.scoutSport=val;render();return;}if(cmd==='shopKind'){ui.shopKind=val;render();return;}if(cmd==='athlete'){ui.view='athletes';ui.selectedAthlete=val;ui.selectedGame=null;ui.profileSeason='All';render();window.scrollTo(0,0);return;}if(cmd==='game'){ui.view='games';ui.selectedGame=val;ui.selectedAthlete=null;render();window.scrollTo(0,0);return;}if(cmd==='modal'){openModal(parts[0],parts[1]||'');return;}if(cmd==='close'){closeModal();return;}if(cmd==='save'){const i=db.saved.indexOf(val);if(i>=0)db.saved.splice(i,1);else db.saved.push(val);save();render();toast(i>=0?'Removed from watchlist.':'Added to local scout watchlist.');return;}if(cmd==='interest'){const i=db.interest.indexOf(val);if(i>=0)db.interest.splice(i,1);else db.interest.push(val);save();render();toast(i>=0?'Removed from saved product concepts.':'Saved product concept, no order placed.');return;}if(cmd==='packet'){packet(val);return;}if(cmd==='scout'){ui.view='scout';ui.scoutSport='Saved';render();if(!db.saved.length)toast('No bookmarked athletes yet.');return;}if(cmd==='shop'){ui.view='shop';ui.shopKind='Saved';render();if(!db.interest.length)toast('No saved product concepts yet.');return;}if(cmd==='export'){download('proof-workspace-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2));toast('Local workspace exported.');return;}if(cmd==='template'){download('proof-stats-template.csv','game_id,athlete_id,stat,value,period,clock,note\ng1,a1,pass_yd,15,Q1,08:42,Example stat line\n','text/csv');toast('CSV template downloaded.');return;}if(cmd==='reset'){if(!confirm('Replace every locally saved record with fictional demo data? Export your data first if needed.'))return;db=createSeed();save();ui.selectedAthlete=null;ui.selectedGame=null;navigate('overview');toast('Sample workspace restored.');return;}if(cmd==='remove'){const e=db.events.find(e=>e.id===val);if(!e||e.source==='demo')return;if(!confirm('Remove this stat entry from the game log?'))return;db.events=db.events.filter(x=>x.id!==val);save();render();toast('Stat entry removed.');}}

document.addEventListener('change',async(ev)=>{if(ev.target.id==='review-game'){ui.filmGame=ev.target.value;const g=game(ui.filmGame);const e=$('#review-athlete');if(e)e.innerHTML='<option value="">Team / general review</option>'+db.athletes.filter(a=>a.sport===g?.sport&&(a.school===g.home||a.school===g.away)).map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+' · '+esc(a.pos)+'</option>').join('');return;}if(ev.target.matches('[data-stage]')){const id=ev.target.dataset.stage;if(!athlete(id)||!STAGES.includes(ev.target.value))return;db.recruiting[id]={...recruited(id),stage:ev.target.value,updatedAt:new Date().toISOString()};save();render();return;}if(ev.target.matches('[data-select]')){const key=ev.target.dataset.select;ui[key]=ev.target.value;if(key==='filmGame'){filmState.gameId=ev.target.value;filmState.time=0;filmState.draft=[];}if(key==='importSport'){ui.importGame=(db.games.find(g=>g.sport===ui.importSport)||{}).id||'';}render();return;}if(ev.target.matches('[data-map]')){if(csvDraft){csvDraft.mapping=csvDraft.mapping||{};csvDraft.mapping[ev.target.dataset.map]=ev.target.value;}return;}if(ev.target.matches('[data-colmap]')){if(csvDraft){csvDraft.columnMap=csvDraft.columnMap||{};csvDraft.columnMap[ev.target.dataset.colmap]=ev.target.value;}return;}if(ev.target.id==='board-sport'){if(boardState.objects.length&&!confirm('Change sport and clear the current unsaved play?')){render();return;}boardState.sport=ev.target.value;boardState.id=null;boardState.objects=[];boardState.history=[];render();return;}if(ev.target.id==='film-rate'){filmState.rate=Number(ev.target.value);const v=$('#proof-film-video');if(v)v.playbackRate=filmState.rate;return;}if(ev.target.id==='import-source'){ui.importSource=ev.target.value;return;}if(ev.target.id==='film-input'){const file=ev.target.files?.[0];if(!file)return;if(!file.type.startsWith('video/')){toast('Select a playable video file.');return;}if(file.size>500*1024*1024){toast('Use a video under 500 MB in this browser demo.');return;}if(filmState.local&&filmState.url)URL.revokeObjectURL(filmState.url);filmState.url=URL.createObjectURL(file);filmState.local=true;filmState.label=file.name;filmState.time=0;filmState.draft=[];render();toast('Opened '+file.name+' locally. Original video stays on your device.');return;}if(ev.target.id==='universal-csv-file'){const file=ev.target.files?.[0];if(!file)return;try{if(file.size>3e6)throw Error('Use a CSV file smaller than 3 MB.');const raw=await file.text(),rows=csvParser(raw);if(rows.length<2||rows.length>5001)throw Error('File needs 1–5,000 data rows.');const headers=rows.shift().map(x=>x.trim().replace(/^\uFEFF/,''));if(new Set(headers.map(cleanHeader)).size!==headers.length)throw Error('Duplicate column headers.');csvDraft={file:file.name,headers,rows,raw};renderCsvPreview();toast('CSV loaded for review.');}catch(e){toast('CSV error: '+e.message)}ev.target.value='';return;}if(ev.target.id==='stat-game'){const g=game(ev.target.value);if(!g)return;$('#stat-athlete').innerHTML=db.athletes.filter(a=>a.sport===g.sport&&(a.school===g.home||a.school===g.away)).map(a=>`<option value="${esc(a.id)}">${esc(a.name)} / ${esc(a.pos)}</option>`).join('');$('#stat-key').innerHTML=statOptions(g.sport).map(x=>`<option value="${x[0]}">${esc(x[2]+' / '+x[1])}</option>`).join('');return;}if(ev.target.id==='csv-input'){const file=ev.target.files?.[0];if(!file)return;try{if(file.size>1000000)throw Error('Keep CSV files under 1 MB.');importCsv(await file.text());}catch(e){toast('Import failed: '+e.message);}ev.target.value='';}});
document.addEventListener('submit',(ev)=>{if(v3Form(ev))return;if(!['athlete-form','game-form','stat-form'].includes(ev.target.id))return;ev.preventDefault();const form=ev.target;const v=Object.fromEntries(new FormData(form).entries());try{
 if(form.id==='athlete-form'){
  if(!v.consent)throw Error('Permission confirmation is required.');if(!v.name?.trim()||!v.school?.trim()||!v.pos?.trim())throw Error('Required profile fields are missing.');if(v.hudl && !safeUrl(v.hudl))throw Error('Please provide a valid http(s) highlight link.');db.athletes.push({id:uid('ath'),name:v.name.trim(),school:v.school.trim(),state:v.state.trim(),sport:v.sport,pos:v.pos.trim().toUpperCase(),grad:Number(v.grad),num:v.num?.trim()||'',height:v.height?.trim()||'',weight:v.weight?.trim()||'',hudl:v.hudl?.trim()||'',bio:v.bio?.trim()||'',coachContact:'',consent:true,demo:false});toast('Unverified athlete profile created.');
 }else if(form.id==='game-form'){
  if(v.home.trim().toLowerCase()===v.away.trim().toLowerCase())throw Error('Home and away teams must differ.');db.games.push({id:uid('gam'),sport:v.sport,date:v.date,home:v.home.trim(),away:v.away.trim(),homeScore:Number(v.homeScore),awayScore:Number(v.awayScore),period:'Final',verification:'unverified',source:'Manual user entry'});toast('Unverified game added.');
 }else if(form.id==='stat-form'){
  const g=game(v.gameId),a=athlete(v.athleteId);if(!g||!a||a.sport!==g.sport||(a.school!==g.home&&a.school!==g.away))throw Error('Athlete must belong to a team in the selected game.');if(!statOptions(g.sport).some(x=>x[0]===v.stat))throw Error('Invalid stat type.');const value=Number(v.value);if(!Number.isFinite(value)||value< -9999||value>9999)throw Error('Invalid quantity.');db.events.push({id:uid('evt'),gameId:g.id,athleteId:a.id,stat:v.stat,value,period:v.period,clock:v.clock?.trim()||'',note:v.note?.trim()||'',source:'manual-unverified',createdAt:new Date().toISOString()});toast('Stat saved. Totals recalculated.');
 }save();closeModal();render();
